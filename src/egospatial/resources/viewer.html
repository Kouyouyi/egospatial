<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>egospatial · 最新模型评测</title><style>
:root{color-scheme:dark;--bg:#10151c;--card:#1b2531;--line:#35465a;--fg:#edf3fb;--muted:#aabed3;--blue:#91c8ff;--green:#93e3b2;--red:#ffaaa7;--amber:#efcc8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}header{padding:1.2rem 1.5rem;border-bottom:1px solid var(--line)}h1{font-size:1.5rem;margin:0}h2{font-size:1.1rem;margin:0 0 .6rem}h3{font-size:1rem;margin:.8rem 0 .4rem}p{margin:.45rem 0}main{max-width:1850px;margin:auto;padding:1rem}.top,.controls{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:.7rem;margin:1rem 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem}.stat b{display:block;font-size:1.25rem}.muted,figcaption{color:var(--muted);font-size:.88rem}.good{color:var(--green)}.bad{color:var(--red)}.pending{color:var(--amber)}button,select,input,a.button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.45rem .65rem}button,a.button{cursor:pointer}button:hover,a:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}a{color:var(--blue)}a.button{text-decoration:none}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:1rem;align-items:start}.sidebar{position:sticky;top:.6rem;max-height:calc(100vh - 1.2rem);display:flex;flex-direction:column;gap:.6rem}.filters{display:grid;gap:.5rem}.filters select,.filters input{width:100%;min-width:0}.sample-list{overflow:auto;min-height:100px}.sample{display:block;width:100%;text-align:left;margin:.45rem 0;padding:.65rem}.sample.selected{background:#294766;border-color:var(--blue)}.sample small{display:block;color:var(--muted)}.sample .line{display:block;font-size:.83rem;overflow-wrap:anywhere}.detail{min-width:0}.detail>.card{margin-bottom:1rem}.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}.review-grid .card{margin-bottom:1rem}.gallery,.attachments{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem}figure{margin:0}figure img{display:block;width:100%;height:auto;border-radius:6px;cursor:zoom-in}figcaption{padding:.35rem 0;overflow-wrap:anywhere}.attachment{border:1px solid var(--line);border-radius:7px;padding:.5rem}.attachment.current{border-color:var(--blue);background:#20374d}.history-label{display:block;color:var(--blue);font-size:.82rem;margin:.25rem 0}.frame-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:1rem 0}.label{display:inline-block;font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:16px;padding:.15rem .6rem;margin:.2rem .25rem .2rem 0}.semantics{font-size:1.1rem;color:var(--blue)}pre{font:inherit;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}details{margin:.7rem 0}video{display:block;width:100%;max-height:460px;background:#000;border-radius:7px}dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:92vw;max-width:1200px}dialog img{width:100%}dialog::backdrop{background:#000b}.empty{padding:2rem;text-align:center;color:var(--muted)}.technical{font-family:ui-monospace,monospace;font-size:.8rem;color:var(--muted)}@media(max-width:1150px){.layout{grid-template-columns:260px minmax(0,1fr)}.review-grid{grid-template-columns:1fr}}@media(max-width:760px){header{padding:1rem}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:540px}.gallery,.attachments{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="top"><h1>egospatial · 最新模型评测</h1><div class="controls"><span id="model"></span><button id="refresh">刷新进度</button></div></div><div class="stats"><div class="stat"><span class="muted">评测进度</span><b id="progress"></b></div><div class="stat"><span class="muted">移动标签匹配率</span><b id="nav-score"></b></div><div class="stat"><span class="muted">交互标签匹配率</span><b id="interact-score"></b></div><div class="stat"><span class="muted">总体标签匹配率</span><b id="overall-score"></b></div></div><p class="muted" id="scope"></p><p class="muted">只展示最新数据的一份结果。保留空间记忆、GT历史与当前帧；本轮答案及动作后图片不提供给模型。组合方向顺序等价。</p></header><main><div class="layout"><aside class="card sidebar"><h2>逐条查看</h2><div class="filters"><input id="search" type="search" placeholder="搜索任务、标签、题号或动作语义"><select id="episode-filter"><option value="">全部任务片段</option></select><div class="controls"><select id="kind-filter"><option value="">全部动作</option><option value="navigation">移动</option><option value="interact">交互</option></select><select id="result-filter"><option value="">全部结果</option><option value="correct">正确</option><option value="wrong">错误</option><option value="pending">待完成</option></select></div></div><p class="muted" id="filter-count"></p><div class="sample-list" id="sample-list"></div><div class="controls"><button id="prev-page">上一页</button><span class="muted" id="page-info"></span><button id="next-page">下一页</button></div></aside><section class="detail"><article class="card"><div class="top"><h2 id="detail-title">选择一条数据</h2><div class="controls"><button id="prev-sample">上一条</button><button id="next-sample">下一条</button></div></div><p id="detail-status" class="muted"></p></article><div id="detail-body"><div class="empty">正在加载最新已完成结果…</div></div></section></div><footer class="card"><p class="muted">正确标签来自当前参考标注，其中导航仍含RGB草稿和二维光流候选；指标表示标签匹配率。人工修正及原始操作可在逐条标注来源和 reference-corrections.json 中核对。</p><div class="controls"><a href="index.json" download>下载全部结果索引</a><a id="download-all" href="all-results.jsonl" download>下载全部输入输出JSONL</a><a href="taxonomy.json" download>31个合法标签写法</a><a href="compound-memory-prompt-template.txt" download>提示词模板</a></div><details><summary>数据与调用信息</summary><pre id="dataset-info" class="technical"></pre></details></footer></main><dialog id="zoom-dialog"><div class="top"><h2 id="zoom-title"></h2><button id="zoom-close">关闭</button></div><img id="zoom-image" alt="放大的观察帧"></dialog>
<script id="initial-index" type="application/json">__INDEX__</script><script>
"use strict";
let I=JSON.parse(document.getElementById("initial-index").textContent),selected=null,page=0,lastVideoEpisode=null;
const $=id=>document.getElementById(id),H=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),pretty=s=>String(s).replace(/\+/g," + "),cache=new Map(),PAGE=40;
function tags(values){return (values||[]).map(x=>'<span class="label">'+H(pretty(x))+'</span>').join("");}
function metric(x){return x.completed?x.correct+"/"+x.completed+" · "+(100*x.accuracy).toFixed(1)+"%":"尚未完成";}
function filtered(){const q=$("search").value.trim().toLowerCase(),e=$("episode-filter").value,k=$("kind-filter").value,r=$("result-filter").value;return I.samples.filter(x=>(!e||x.episode_id===e)&&(!k||x.kind===k)&&(!r||(r==="pending"?x.status!=="completed":x.status==="completed"&&(r==="correct"?x.correct:!x.correct)))&&(!q||[x.id,x.question_id,x.goal,x.reference_semantics,x.prediction_semantics,...x.expected_labels,...(x.predicted_labels||[])].join(" ").toLowerCase().includes(q)));}
function resultText(x){return x.status!=="completed"?"待完成":x.correct?"标签正确":"标签错误";}
function renderList(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/PAGE));page=Math.min(page,pages-1);$("filter-count").textContent="匹配 "+rows.length+" / "+I.total+" 条";$("page-info").textContent=(page+1)+"/"+pages;$("prev-page").disabled=page===0;$("next-page").disabled=page>=pages-1;$("sample-list").innerHTML=rows.slice(page*PAGE,(page+1)*PAGE).map(x=>'<button class="sample '+(x.id===selected?"selected":"")+'" data-case-id="'+H(x.id)+'"><b>#'+x.ordinal+' · 题'+x.question_id+' / 步骤'+(x.step_index+1)+'</b><small>源帧 '+x.current_frame+' → '+x.after_frame+' · '+resultText(x)+'</small><span class="line good">正确标签：'+H(x.expected_labels.map(pretty).join(", "))+'</span><span class="line '+(x.status!=="completed"?"pending":x.correct?"good":"bad")+'">'+(x.status!=="completed"?"尚无模型回复":(x.correct?"预测标签：":"错误预测：")+(x.predicted_labels||[]).map(pretty).join(", "))+'</span></button>').join("")||'<p class="empty">没有匹配数据</p>';}
function zoom(src,label){$("zoom-image").src=src;$("zoom-title").textContent=label;$("zoom-dialog").showModal();}
function renderCase(c){if(c.id!==selected)return;const x=I.samples.find(x=>x.id===c.id);$("detail-title").textContent="#"+x.ordinal+" / "+I.total+" · 题"+c.question_id+" · 步骤"+(c.step_index+1);$("detail-status").textContent="当前帧 "+c.current_frame+" → 结束帧 "+c.after_frame+" · "+resultText(x);let n=0,buffer=[],figures=[];
for(const b of c.request.messages[1].content){if(b.type==="text"){buffer.push(b.text);continue;}if(b.type!=="image")continue;const j=n++,f=c.request.image_source_frames[j],cur=j===c.image_files.length-1;const role=j<c.spatial_memory.length?"空间记忆 "+c.spatial_memory[j].id:j===c.spatial_memory.length?"任务anchor":"历史观察";const label=buffer.find(t=>t.startsWith("上一观察后")||t.startsWith("该历史区间"))||"";figures.push('<figure class="attachment '+(cur?"current":"")+'">'+(label?'<span class="history-label">'+H(label)+'</span>':"")+'<img loading="lazy" src="'+H(c.image_files[j])+'" data-zoom="'+H(c.image_files[j])+'" data-title="'+H(role+" · 源帧 "+f)+'" alt="'+H(role)+'"><figcaption>附件'+(j+1)+' · '+H(role)+(cur?" / 当前帧":"")+' · f'+f+'</figcaption></figure>');buffer=[];}
let pred={};try{pred=JSON.parse(c.output.answer);}catch{}
const frames='<div class="frame-pair"><figure><figcaption>当前帧 · f'+c.current_frame+'</figcaption><img src="'+H(c.image_files.at(-1))+'" data-zoom="'+H(c.image_files.at(-1))+'" data-title="当前帧" alt="当前帧"></figure><figure><figcaption>结束帧 · f'+c.after_frame+'</figcaption><img src="'+H(c.reference.after_image_file)+'" data-zoom="'+H(c.reference.after_image_file)+'" data-title="结束帧（本轮未发送）" alt="动作结束帧"></figure></div>';
const mem=c.spatial_memory.map(m=>'<figure><img loading="lazy" src="'+H(m.image_file)+'" data-zoom="'+H(m.image_file)+'" data-title="'+H(m.id+" · f"+m.source_frame)+'" alt="'+H(m.id)+'"><figcaption>'+H(m.id)+' · f'+m.source_frame+'<br>'+H(m.description)+'</figcaption></figure>').join("");
$("detail-body").innerHTML='<article class="card"><h2>空间记忆 · 本轮实际提供 '+c.spatial_memory.length+' 张</h2><div class="gallery">'+mem+'</div></article><div class="review-grid"><section><article class="card"><h2>实际模型输入 · '+c.image_files.length+' 张图</h2><p>'+H(c.goal)+'</p><details><summary>实际SYSTEM提示词</summary><pre>'+H(c.request.messages[0].content)+'</pre></details><div class="attachments">'+figures.join("")+'</div><details><summary>完整模型文本（图片按附件编号对应）</summary><pre>'+H(c.request.prompt)+'</pre></details><div class="controls"><a class="button" href="'+H(x.detail_json)+'" download>下载本条输入输出</a><a href="'+H(c.request_file)+'" download>下载实际request</a></div></article></section><section><article class="card"><div class="top"><h2>模型原始输出与参考</h2><b class="'+(x.correct?"good":"bad")+'">'+resultText(x)+'</b></div><p class="muted">任务文本</p><p>'+H(c.goal)+'</p>'+frames+'<p class="muted">正确标签（本轮未发送给模型）</p><div>'+tags(c.reference.action_labels)+'</div><p>'+H(c.reference.action_semantics)+'</p><h3>模型输出</h3><p class="semantics">'+H(pred.action_semantics||"无法解析，原始回复如下")+'</p><div>'+tags(pred.action_labels)+'</div><pre>'+H(c.output.answer)+'</pre><p class="muted">'+H(c.output.model)+' · '+Number(c.output.duration_seconds).toFixed(1)+'秒</p><details><summary>标注来源、原操作和调用记录</summary><p>'+H(c.reference.quality)+'</p>'+c.reference.component_steps.map(s=>'<p>'+H(s.action_semantics)+' <span class="muted">f'+s.before_frame+' → f'+s.after_frame+'</span></p>').join("")+'<pre class="technical">run_id: '+H(c.run_id)+'\ninput_sha256: '+H(c.request.input_sha256)+'</pre><a href="'+H(c.output_file)+'" download>下载完整原始模型结果</a></details></article><article class="card"><h2>这个任务的完整视频</h2><p class="muted">f'+c.video.start_frame+'–'+c.video.end_frame+' · '+((c.video.end_frame-c.video.start_frame+1)/c.video.fps).toFixed(2)+'秒</p><video id="task-video" controls playsinline preload="metadata" src="'+H(c.video.file)+'"></video><div class="controls"><button id="play-all">从头播放完整任务</button><button id="play-step">播放当前步骤区间</button><button id="half-speed">0.5倍速</button><button id="normal-speed">正常速度</button></div></article></section></div>';
$("detail-body").querySelectorAll("[data-zoom]").forEach(el=>el.addEventListener("click",()=>zoom(el.dataset.zoom,el.dataset.title)));
const v=$("task-video");let stop=null;
$("play-all").onclick=()=>{stop=null;v.currentTime=0;v.play().catch(()=>{});};$("play-step").onclick=()=>{v.currentTime=(c.current_frame-c.video.start_frame)/c.video.fps;stop=(c.after_frame-c.video.start_frame+1)/c.video.fps;v.play().catch(()=>{});};$("half-speed").onclick=()=>v.playbackRate=.5;$("normal-speed").onclick=()=>v.playbackRate=1;v.ontimeupdate=()=>{if(stop!==null&&v.currentTime>=stop){v.pause();stop=null;}};
}
window.latestBenchCaseReady=(id,c)=>{cache.set(id,c);if(cache.size>24){const k=cache.keys().next().value;if(k!==selected)cache.delete(k);}if(id===selected)renderCase(c);};
function select(id){selected=id;const x=I.samples.find(x=>x.id===id);renderList();if(!x){$("detail-title").textContent="没有匹配数据";$("detail-status").textContent="";$("detail-body").innerHTML='<div class="empty">没有可查看的匹配数据</div>';return;}$("detail-title").textContent="#"+x.ordinal+" / "+I.total+" · 题"+x.question_id+" · 步骤"+(x.step_index+1);$("detail-status").textContent="当前帧 "+x.current_frame+" → 结束帧 "+x.after_frame+" · "+resultText(x);if(x.status!=="completed"){$("detail-body").innerHTML='<article class="card empty">这条尚未完成模型评测，当前没有真实输入输出可展示。</article>';return;}const found=cache.get(id);if(found&&found.run_id===x.run_id)return renderCase(found);$("detail-body").innerHTML='<div class="empty">正在加载本条实际模型输入输出…</div>';const s=document.createElement("script");s.src=x.detail_js+"?run="+encodeURIComponent(x.run_id);s.onload=()=>s.remove();s.onerror=()=>{if(selected===id)$("detail-body").innerHTML='<div class="empty">数据文件尚未同步，请稍后刷新。</div>';s.remove();};document.head.appendChild(s);}
function updateHeader(){$("download-all").hidden=!I.archive_ready;const selectedEpisode=$("episode-filter").value;$("model").textContent=I.model;$("progress").textContent=I.completed+" / "+I.total;$("nav-score").textContent=metric(I.summary.navigation);$("interact-score").textContent=metric(I.summary.interact);$("overall-score").textContent=metric(I.summary.all);$("scope").textContent=I.evaluable_task_intervals+" 个可评任务片段 · 待完成 "+I.pending+" 条 · 更新于 "+new Date(I.updated_unix*1000).toLocaleTimeString();$("episode-filter").innerHTML='<option value="">全部任务片段</option>'+I.episodes.filter(e=>e.count>0).map(e=>'<option value="'+H(e.episode_id)+'">题'+e.question_id+' · '+e.count+'条 · '+H(e.goal.slice(0,42))+'</option>').join("");$("episode-filter").value=selectedEpisode;$("dataset-info").textContent="dataset_version: "+I.dataset_version+"\nbatch_id: "+I.batch_id+"\ninput_protocol: "+I.input_protocol+"\nevaluation_policy: "+I.evaluation_policy;}
window.latestBenchIndexReady=next=>{I=next;updateHeader();const rows=filtered();if(!rows.some(x=>x.id===selected)){select(rows.find(x=>x.status==="completed")?.id||rows[0]?.id);return;}renderList();const x=rows.find(x=>x.id===selected);if(x.status==="completed"&&!cache.has(selected))select(selected);};
function refresh(){const s=document.createElement("script");s.src="index.js?t="+Date.now();s.onload=()=>s.remove();s.onerror=()=>s.remove();document.head.appendChild(s);}
function changeFilters(){page=0;const rows=filtered();if(!rows.some(x=>x.id===selected))select(rows[0]?.id);else renderList();}
for(const id of ["episode-filter","kind-filter","result-filter"])$(id).addEventListener("change",changeFilters);$("search").addEventListener("input",changeFilters);
$("sample-list").addEventListener("click",e=>{const b=e.target.closest("[data-case-id]");if(b)select(b.dataset.caseId);});
$("prev-page").onclick=()=>{page=Math.max(0,page-1);renderList();};$("next-page").onclick=()=>{page++;renderList();};
function move(d){const rows=filtered();const i=Math.max(0,Math.min(rows.length-1,rows.findIndex(x=>x.id===selected)+d));page=Math.floor(i/PAGE);select(rows[i]?.id);}
$("prev-sample").onclick=()=>move(-1);$("next-sample").onclick=()=>move(1);$("refresh").onclick=refresh;$("zoom-close").onclick=()=>$("zoom-dialog").close();
updateHeader();select(I.samples.find(x=>x.status==="completed")?.id||I.samples[0]?.id);setInterval(refresh,30000);
</script></body></html>
